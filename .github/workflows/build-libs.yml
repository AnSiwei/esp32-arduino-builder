name: Build ESP32 Arduino Libs

# GitHub Actions 需要 contents: write 权限才能创建 release、上传 asset 以及
# 将 .last_build_versions / platform.json 推回仓库。
permissions:
  contents: write

# 触发方式：
# 1. schedule: 每周一 02:00 检查一次上游 arduino-esp32 是否有更新，有则自动编译。
#    免费账号每月 Actions 分钟数/次数有限，改为每周执行以节省配额。
# 2. workflow_dispatch: 支持手动触发（可指定目标芯片和版本）
on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:
    inputs:
      targets:
        description: '目标芯片（逗号分隔）'
        required: false
        default: 'esp32,esp32s2,esp32s3,esp32c2,esp32c3,esp32c5,esp32c6,esp32c61,esp32h2,esp32p4'
      arduino_version:
        description: 'arduino-esp32 版本（auto = 自动检测最新 release）'
        required: false
        default: 'auto'
      idf_version:
        description: 'ESP-IDF 版本（auto = 从 arduino release 标题提取）'
        required: false
        default: 'auto'

jobs:
  # 准备 job：解析版本、确定构建目标、判断是否需要构建。
  # 拆分后各芯片并行编译，本 job 只做轻量准备，不占用容器。
  prepare:
    runs-on: ubuntu-latest
    outputs:
      arduino_version: ${{ steps.ver.outputs.arduino_version }}
      idf_version: ${{ steps.ver.outputs.idf_version }}
      idf_branch: ${{ steps.ver.outputs.idf_branch }}
      targets: ${{ steps.targets.outputs.targets }}
      targets_json: ${{ steps.targets.outputs.targets_json }}
      publish: ${{ steps.targets.outputs.publish }}
      build: ${{ steps.should_build.outputs.build }}
    steps:
      - name: 检出平台仓库
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: 解析版本
        id: ver
        run: |
          AR_INPUT="${{ github.event.inputs.arduino_version || 'auto' }}"
          IDF_INPUT="${{ github.event.inputs.idf_version || 'auto' }}"

          # ---- arduino-esp32 版本 ----
          if [ "$AR_INPUT" = "auto" ]; then
            # git ls-remote 列出所有 tag，筛选纯数字版本号，sort -V 取最新
            AR_VERSION=$(git ls-remote --tags --refs https://github.com/espressif/arduino-esp32.git \
              | grep -oP 'refs/tags/\K[0-9]+\.[0-9]+\.[0-9]+$' \
              | sort -V | tail -1)
            if [ -z "$AR_VERSION" ]; then
              echo "❌ 无法获取 arduino-esp32 最新版本"
              exit 1
            fi
            echo "arduino 来源: 自动检测 (git ls-remote)"
          else
            AR_VERSION="$AR_INPUT"
            echo "arduino 来源: 手动指定"
          fi
          echo "arduino_version=$AR_VERSION" >> "$GITHUB_OUTPUT"
          echo "arduino-esp32 版本: $AR_VERSION"

          # ---- ESP-IDF 版本 ----
          if [ "$IDF_INPUT" = "auto" ]; then
            # 从 arduino-esp32 release 页面提取配套 ESP-IDF 版本
            # 用 HTML 页面代替 API，避免 GitHub API 速率限制（未认证 60次/小时）
            # 标题格式: "Arduino Release v3.3.11 based on ESP-IDF v5.5.5"
            RELEASE_HTML=$(curl -sL --max-time 30 "https://github.com/espressif/arduino-esp32/releases/tag/$AR_VERSION" || echo "")
            if [ -z "$RELEASE_HTML" ]; then
              echo "❌ 无法获取 arduino-esp32 release 页面"
              exit 1
            fi
            IDF_VERSION=$(echo "$RELEASE_HTML" | grep -oP 'based on ESP-IDF \Kv[0-9]+\.[0-9]+\.[0-9]+' | head -1)
            if [ -z "$IDF_VERSION" ]; then
              # 标题没匹配到，尝试从页面内容匹配
              IDF_VERSION=$(echo "$RELEASE_HTML" | grep -oiP 'esp-idf\s+v?\K[0-9]+\.[0-9]+\.[0-9]+' | head -1)
              if [ -n "$IDF_VERSION" ]; then
                IDF_VERSION="v$IDF_VERSION"
              fi
            fi
            if [ -z "$IDF_VERSION" ]; then
              echo "❌ 无法从 arduino-esp32 release 页面中提取 ESP-IDF 版本"
              exit 1
            fi
            echo "idf 来源: 自动提取 (arduino release 页面)"
          else
            IDF_VERSION="$IDF_INPUT"
            echo "idf 来源: 手动指定"
          fi
          echo "idf_version=$IDF_VERSION" >> "$GITHUB_OUTPUT"
          echo "ESP-IDF 版本: $IDF_VERSION"

          # ---- 从 IDF tag 自动推导分支 ----
          # v5.5.5 → release/v5.5
          IDF_BRANCH=$(echo "$IDF_VERSION" | grep -oP '^v\K[0-9]+\.[0-9]+')
          IDF_BRANCH="release/v$IDF_BRANCH"
          echo "idf_branch=$IDF_BRANCH" >> "$GITHUB_OUTPUT"
          echo "ESP-IDF 分支: $IDF_BRANCH"

      - name: 确定构建目标及发布状态
        id: targets
        env:
          REQUESTED_TARGETS: ${{ github.event.inputs.targets || 'esp32,esp32s2,esp32s3,esp32c2,esp32c3,esp32c5,esp32c6,esp32c61,esp32h2,esp32p4' }}
        run: |
          set -eu
          # A manual subset is permitted for fast troubleshooting, but its
          # output is diagnostic-only. It must not replace framework-latest.
          python3 - "$REQUESTED_TARGETS" "$GITHUB_OUTPUT" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          canonical = {
              "esp32", "esp32s2", "esp32s3", "esp32c2", "esp32c3",
              "esp32c5", "esp32c6", "esp32c61", "esp32h2", "esp32p4",
          }
          raw = sys.argv[1]
          items = [item.strip() for item in raw.split(",") if item.strip()]
          if not items:
              raise SystemExit("targets must contain at least one chip")
          if any(not re.fullmatch(r"esp32[a-z0-9]*", item) for item in items):
              raise SystemExit(f"invalid target list: {raw!r}")
          if len(set(items)) != len(items):
              raise SystemExit(f"duplicate chip in target list: {raw!r}")
          unknown = set(items) - canonical
          if unknown:
              raise SystemExit(f"unsupported target(s): {sorted(unknown)}")

          publish = "yes" if set(items) == canonical else "no"
          out = Path(sys.argv[2])
          with out.open("a", encoding="utf-8") as fp:
              fp.write(f"targets={','.join(items)}\n")
              fp.write(f"targets_json={json.dumps(items)}\n")
              fp.write(f"publish={publish}\n")
          print(f"Build targets: {','.join(items)}")
          if publish == "yes":
              print("Complete target set: public releases may be updated.")
          else:
              print("Partial target set: only debug-run artifacts may be published.")
          PY

      - name: 读取上次构建的版本
        id: last
        run: |
          if [ -f .last_build_versions ]; then
            LAST_AR=$(grep '^arduino=' .last_build_versions | cut -d= -f2-)
            LAST_IDF=$(grep '^idf=' .last_build_versions | cut -d= -f2-)
            LAST_COMPLETE=$(grep '^complete=' .last_build_versions | cut -d= -f2-)
          else
            LAST_AR=""
            LAST_IDF=""
            LAST_COMPLETE=""
          fi
          echo "last_arduino=$LAST_AR" >> "$GITHUB_OUTPUT"
          echo "last_idf=$LAST_IDF" >> "$GITHUB_OUTPUT"
          echo "last_complete=$LAST_COMPLETE" >> "$GITHUB_OUTPUT"
          echo "上次构建: arduino=$LAST_AR, idf=$LAST_IDF"

      - name: 判断是否需要构建
        id: should_build
        run: |
          # 手动触发时强制构建
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "手动触发，强制构建"
            echo "build=yes" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # 定时触发时比对版本
          CUR_AR="${{ steps.ver.outputs.arduino_version }}"
          CUR_IDF="${{ steps.ver.outputs.idf_version }}"
          LAST_AR="${{ steps.last.outputs.last_arduino }}"
          LAST_IDF="${{ steps.last.outputs.last_idf }}"
          LAST_COMPLETE="${{ steps.last.outputs.last_complete }}"
          if [ "$LAST_COMPLETE" != "yes" ]; then
            echo "Last recorded build is incomplete; rebuilding the full target set."
            echo "build=yes" >> "$GITHUB_OUTPUT"
          elif [ "$CUR_AR" != "$LAST_AR" ] || [ "$CUR_IDF" != "$LAST_IDF" ]; then
            echo "上游有更新: arduino $LAST_AR → $CUR_AR, idf $LAST_IDF → $CUR_IDF"
            echo "build=yes" >> "$GITHUB_OUTPUT"
          else
            echo "上游无更新: arduino=$CUR_AR, idf=$CUR_IDF"
            echo "build=no" >> "$GITHUB_OUTPUT"
          fi

  # 构建 job：每个芯片一个并行 job，独立编译单个芯片。
  # 拆分后单个 job 编译时间远低于 6 小时上限，避免免费账号超时。
  # 产物上传到 debug-run release 作为中间存储（免费账号 artifact 配额小，
  # 而 Release 存储无硬性限制）。
  build:
    needs: prepare
    if: needs.prepare.outputs.build == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        chip: ${{ fromJson(needs.prepare.outputs.targets_json) }}
    container:
      image: espressif/esp32-arduino-lib-builder:release-v5.5
    env:
      # Reuse the lock file and local component cache during repeated CMake configure
      # steps. Without this, the final esp32 bootloader configure may query the registry
      # again and fail after a long build when the registry/proxy has a transient outage.
      IDF_COMPONENT_CHECK_NEW_VERSION: "0"
      IDF_COMPONENT_CACHE_HTTP_REQUESTS: "1"
      IDF_COMPONENT_API_TIMEOUT: "120"
    steps:
      - name: 检出平台仓库
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: 准备构建环境（补丁脚本）
        run: |
          # GitHub Actions 注入的 GITHUB_TOKEN 只能访问当前仓库，无法访问
          # espressif/arduino-esp32。config.sh 会用 GITHUB_TOKEN 拼
          # AR_REPO_URL=https://<token>@github.com/espressif/arduino-esp32.git，
          # 导致 clone 失败。unset 后 config.sh 回退到匿名 URL（公开仓库可匿名 clone）。
          unset GITHUB_TOKEN
          # 强制设为 espressif，使 AR_REPO_URL=https://github.com/espressif/arduino-esp32.git
          export GITHUB_REPOSITORY_OWNER=espressif
          export GITHUB_REPOSITORY=espressif/arduino-esp32
          bash tools/prepare-build.sh

      - name: 编译芯片 ${{ matrix.chip }}
        run: |
          CHIP="${{ matrix.chip }}"
          IDF_BRANCH="${{ needs.prepare.outputs.idf_branch }}"
          IDF_COMMIT="${{ needs.prepare.outputs.idf_version }}"
          ARDUINO_BRANCH="${{ needs.prepare.outputs.arduino_version }}"
          echo "构建芯片: $CHIP"
          echo "IDF 分支: $IDF_BRANCH"
          echo "IDF 提交: $IDF_COMMIT"
          echo "Arduino 版本: $ARDUINO_BRANCH"
          cd /opt/esp/lib-builder
          unset GITHUB_TOKEN
          export GITHUB_REPOSITORY_OWNER=espressif
          export GITHUB_REPOSITORY=espressif/arduino-esp32
          ./build.sh -t "$CHIP" -I "$IDF_BRANCH" -i "$IDF_COMMIT" -A "$ARDUINO_BRANCH" -e

      - name: 上传芯片产物到 debug-run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          test -n "${GITHUB_TOKEN:-}" || { echo "GITHUB_TOKEN is not configured" >&2; exit 1; }
          CHIP="${{ matrix.chip }}"
          DEBUG_TAG="debug-run-${{ github.run_id }}"
          # 每个芯片 job 上传自己的 <chip>/ 子目录（含全局 package.json/tools.json，
          # 各 job 内容一致，合并时用任意一份即可）。
          CHIP_DIR="/opt/esp/lib-builder/out/tools/esp32-arduino-libs/$CHIP"
          test -d "$CHIP_DIR/lib" || { echo "❌ $CHIP 编译产物缺失" >&2; exit 1; }
          # 打包该芯片子目录（含全局文件，供合并 job 使用）
          cd /opt/esp/lib-builder/out/tools/esp32-arduino-libs
          TAR_FILES="$CHIP package.json tools.json"
          if [ -f versions.txt ]; then
            TAR_FILES="$TAR_FILES versions.txt"
          fi
          tar czf "/tmp/chip-$CHIP.tar.gz" $TAR_FILES
          python3 "$GITHUB_WORKSPACE/tools/release_io.py" upload \
            --repo "${{ github.repository }}" \
            --token "$GITHUB_TOKEN" \
            --tag "$DEBUG_TAG" \
            --file "/tmp/chip-$CHIP.tar.gz"
          echo "✅ $CHIP 产物已上传"

  # 合并打包 job：下载所有芯片产物，组装完整的 esp32-arduino-libs/，
  # 打包 zip + framework tar.xz，并做校验。
  package:
    needs: [prepare, build]
    if: needs.build.result == 'success' && needs.prepare.outputs.build == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      zip_name: ${{ steps.package.outputs.zip_name }}
      framework_name: ${{ steps.package.outputs.framework_name }}
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 检出平台仓库
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: 下载所有芯片产物
        run: |
          set -eu
          DEBUG_TAG="debug-run-${{ github.run_id }}"
          mkdir -p /tmp/chips
          python3 tools/release_io.py download \
            --repo "${{ github.repository }}" \
            --token "$GITHUB_TOKEN" \
            --tag "$DEBUG_TAG" \
            --prefix "chip-" \
            --out-dir /tmp/chips
          ls -lh /tmp/chips

      - name: 合并芯片产物
        run: |
          set -eu
          mkdir -p tools/esp32-arduino-libs
          # 逐个解压芯片子目录到 esp32-arduino-libs/
          for f in /tmp/chips/chip-*.tar.gz; do
            echo "解压: $f"
            tar xzf "$f" -C tools/esp32-arduino-libs
          done
          # 验证所有请求的芯片都编译成功（有 lib/ 子目录才算成功）
          REQUESTED_TARGETS="${{ needs.prepare.outputs.targets }}"
          BUILT_CHIPS=""
          MISSING_CHIPS=""
          for chip in $(echo "$REQUESTED_TARGETS" | tr ',' ' '); do
            chip_dir="tools/esp32-arduino-libs/$chip"
            if [ -d "$chip_dir/lib" ]; then
              echo "✅ $chip: lib/ 存在"
              BUILT_CHIPS="$BUILT_CHIPS $chip"
            else
              echo "❌ $chip: lib/ 不存在"
              MISSING_CHIPS="$MISSING_CHIPS $chip"
            fi
          done
          # 所有请求的芯片都必须编译成功，否则构建失败
          if [ -n "$MISSING_CHIPS" ]; then
            echo "❌ 以下芯片编译失败:$MISSING_CHIPS"
            echo "已编译的芯片:$BUILT_CHIPS"
            exit 1
          fi
          echo "已编译的芯片:$BUILT_CHIPS"
          # 基本文件检查（package.json 和 tools.json 由 lib-builder 生成）
          test -f tools/esp32-arduino-libs/package.json
          test -f tools/esp32-arduino-libs/tools.json

      - name: 校验并打包
        id: package
        run: |
          set -eu
          cd "$GITHUB_WORKSPACE"
          REQUESTED_TARGETS="${{ needs.prepare.outputs.targets }}"

          # 防止错误产物进入 Release：校验实际 PioArduino metadata 中的
          # picolibc specs，并拒绝 nano.specs 和构建容器绝对路径。
          NORMALIZATION_LOG="tools/pio-specs-normalization.log"
          python3 tools/normalize_pio_specs.py \
            --libs-dir tools/esp32-arduino-libs \
            --targets "$REQUESTED_TARGETS" >"$NORMALIZATION_LOG" 2>&1
          cat "$NORMALIZATION_LOG"

          # Keep this result as a diagnostic rather than stopping here.
          PIO_VALIDATION_LOG="tools/pio-artifact-validation.log"
          if python3 tools/validate_pio_libs.py \
            --libs-dir tools/esp32-arduino-libs \
            --targets "$REQUESTED_TARGETS" >"$PIO_VALIDATION_LOG" 2>&1; then
            PIO_VALIDATION_STATUS=0
          else
            PIO_VALIDATION_STATUS=$?
          fi
          cat "$PIO_VALIDATION_LOG"

          echo "arduino=${{ needs.prepare.outputs.arduino_version }}" > .last_build_versions
          echo "idf=${{ needs.prepare.outputs.idf_version }}" >> .last_build_versions

          # 打包预编译库为 zip（不提交进 git 仓库，避免 Windows 上 git clone 时
          # 因超长路径（>260 字符）导致 checkout 失败）。
          ZIP_NAME="esp32-arduino-libs.zip"
          echo "打包静态库: $ZIP_NAME"
          cd tools/esp32-arduino-libs
          python3 -c "import os, zipfile; src='.'; out='../esp32-arduino-libs.zip'; zf=zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED,compresslevel=9); [zf.write(os.path.join(r,f), os.path.relpath(os.path.join(r,f),src).replace(os.sep,'/')) for r,ds,fs in os.walk(src) for f in fs]; [zf.writestr(zipfile.ZipInfo(os.path.relpath(os.path.join(r,d),src).replace(os.sep,'/')+'/'), '') for r,ds,fs in os.walk(src) for d in ds]; zf.close(); print('zip 打包完成')"
          cd "$GITHUB_WORKSPACE"
          ls -lh "tools/${ZIP_NAME}"
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"

          # ---- 组装并打包完整 framework 包 ----
          # 从 GitHub 匿名 clone arduino-esp32 源码（指定版本 tag），
          # 供 package_framework.py 组装 framework 包。
          echo "获取 arduino-esp32 源码..."
          AR_VERSION="${{ needs.prepare.outputs.arduino_version }}"
          git clone --depth 1 --branch "$AR_VERSION" \
            https://github.com/espressif/arduino-esp32.git /tmp/arduino-src
          echo "组装 framework 包..."
          python3 tools/package_framework.py \
            --arduino-src /tmp/arduino-src \
            --libs-dir tools/esp32-arduino-libs \
            --out-dir tools \
            --arduino-version "$AR_VERSION" \
            --idf-version "${{ needs.prepare.outputs.idf_version }}"
          echo "framework_name=framework-arduinoespressif32" >> "$GITHUB_OUTPUT"
          ls -lh tools/framework-arduinoespressif32.tar.xz

          # Final acceptance checks run before any Release API call.
          if [ "$PIO_VALIDATION_STATUS" -ne 0 ]; then
            echo "Raw PioArduino metadata validation failed; see $PIO_VALIDATION_LOG" >&2
            exit "$PIO_VALIDATION_STATUS"
          fi
          if ! python3 tools/validate_pio_package.py \
            --libs-dir tools/esp32-arduino-libs \
            --libs-zip tools/esp32-arduino-libs.zip \
            --framework-tar tools/framework-arduinoespressif32.tar.xz \
            --targets "$REQUESTED_TARGETS" >>"$PIO_VALIDATION_LOG" 2>&1; then
            cat "$PIO_VALIDATION_LOG" >&2
            exit 1
          fi
          cat "$PIO_VALIDATION_LOG"

      - name: 上传打包产物到 debug-run release
        run: |
          set -eu
          test -n "${GITHUB_TOKEN:-}" || { echo "GITHUB_TOKEN is not configured" >&2; exit 1; }
          DEBUG_TAG="debug-run-${{ github.run_id }}"
          # 把打包产物上传到 debug-run release，供 publish job 下载。
          # framework 包较大（~350MB），用 Release 存储（无硬性限制）而非
          # artifact（免费账号配额小）。
          for f in tools/esp32-arduino-libs.zip tools/framework-arduinoespressif32.tar.xz; do
            test -f "$f" || { echo "missing package file: $f" >&2; exit 1; }
            python3 tools/release_io.py upload \
              --repo "${{ github.repository }}" \
              --token "$GITHUB_TOKEN" \
              --tag "$DEBUG_TAG" \
              --file "$f"
          done
          echo "✅ 打包产物已上传到 $DEBUG_TAG"

  # 发布 job：上传产物到正式 release，并清理旧版本（只保留最新两个）。
  publish:
    needs: [prepare, package]
    if: needs.package.result == 'success' && needs.prepare.outputs.build == 'yes' && needs.prepare.outputs.publish == 'yes'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: 检出平台仓库
        uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0

      - name: 下载打包产物
        run: |
          set -eu
          test -n "${GITHUB_TOKEN:-}" || { echo "GITHUB_TOKEN is not configured" >&2; exit 1; }
          DEBUG_TAG="debug-run-${{ github.run_id }}"
          mkdir -p /tmp/packages
          python3 tools/release_io.py download \
            --repo "${{ github.repository }}" \
            --token "$GITHUB_TOKEN" \
            --tag "$DEBUG_TAG" \
            --prefix "esp32-arduino-libs.zip" \
            --out-dir /tmp/packages
          python3 tools/release_io.py download \
            --repo "${{ github.repository }}" \
            --token "$GITHUB_TOKEN" \
            --tag "$DEBUG_TAG" \
            --prefix "framework-arduinoespressif32.tar.xz" \
            --out-dir /tmp/packages
          ls -lh /tmp/packages
          # 放到 publish 步骤期望的 tools/ 路径下
          mkdir -p tools
          cp /tmp/packages/esp32-arduino-libs.zip tools/
          cp /tmp/packages/framework-arduinoespressif32.tar.xz tools/
          ls -lh tools/

      - name: 上传产物到 GitHub Release
        run: |
          set -eu
          test -n "${GITHUB_TOKEN:-}" || { echo "GITHUB_TOKEN is not configured" >&2; exit 1; }
          GITHUB_API="https://api.github.com"
          # 上传 release asset 必须用 uploads.github.com 域名（api.github.com 返回 404）
          GITHUB_UPLOADS_API="https://uploads.github.com"
          REPO="${{ github.repository }}"
          ZIP_NAME="${{ needs.package.outputs.zip_name }}"
          AR_VER="${{ needs.prepare.outputs.arduino_version }}"
          IDF_VER="${{ needs.prepare.outputs.idf_version }}"
          TAG="libs-${AR_VER}-${IDF_VER}"
          FRAMEWORK_NAME="${{ needs.package.outputs.framework_name }}"
          # PlatformIO caches packages by URL. Use a new immutable URL for each
          # complete run instead of replacing a file behind a fixed URL.
          FRAMEWORK_ASSET_NAME="${FRAMEWORK_NAME}-${AR_VER}-${IDF_VER}-run${{ github.run_id }}.tar.xz"

          # 2) 查询/创建 release（tag 不存在则创建）
          RELEASE_JSON=$(curl -fsS -H "Authorization: token ${GITHUB_TOKEN}" \
            "${GITHUB_API}/repos/${REPO}/releases/tags/${TAG}" || echo "")
          if [ "$(echo "$RELEASE_JSON" | grep -c '"id"')" -eq 0 ]; then
            echo "创建 release $TAG"
            RELEASE_JSON=$(curl -fsS -X POST -H "Authorization: token ${GITHUB_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"${TAG}\",\"target_commitish\":\"develop\",\"name\":\"ESP32 Arduino Libs ${AR_VER} (IDF ${IDF_VER})\",\"body\":\"precompiled static libraries\",\"draft\":false,\"prerelease\":false}" \
              "${GITHUB_API}/repos/${REPO}/releases")
          fi
          RELEASE_ID=$(echo "$RELEASE_JSON" | grep -oP '"id":\s*\K[0-9]+' | head -1)
          test -n "$RELEASE_ID" || { echo "GitHub release response has no id" >&2; exit 1; }
          echo "release_id=$RELEASE_ID"

          # Publish a stable libs zip and an immutable framework archive.
          # If this exact run is retried, replace only matching asset names.
          for ASSET_NAME in "${ZIP_NAME}" "${FRAMEWORK_ASSET_NAME}"; do
            echo "处理 asset: $ASSET_NAME"
            # 用 assets API + JSON 解析查找旧 asset。不要依赖 GitHub 返回 JSON 的字段顺序。
            ASSETS_JSON=$(curl -fsS -H "Authorization: token ${GITHUB_TOKEN}" \
              "${GITHUB_API}/repos/${REPO}/releases/${RELEASE_ID}/assets")
            ASSET_ID=$(echo "$ASSETS_JSON" | python3 -c "import sys,json; name='${ASSET_NAME}'; print(next((str(a.get('id')) for a in json.load(sys.stdin) if a.get('name') == name), ''))")
            if [ -n "$ASSET_ID" ]; then
              echo "删除旧 asset $ASSET_ID"
              curl -fsS -X DELETE -H "Authorization: token ${GITHUB_TOKEN}" \
                "${GITHUB_API}/repos/${REPO}/releases/assets/${ASSET_ID}"
            fi

            # 4) 上传新 asset
            if [ "$ASSET_NAME" = "$FRAMEWORK_ASSET_NAME" ]; then
              ASSET_PATH="tools/${FRAMEWORK_NAME}.tar.xz"
            else
              ASSET_PATH="tools/${ASSET_NAME}"
            fi
            test -f "$ASSET_PATH" || { echo "missing asset file: $ASSET_PATH" >&2; exit 1; }
            echo "上传 $ASSET_NAME 到 release $RELEASE_ID"
            UPLOAD_JSON=$(curl -fsS -X POST -H "Authorization: token ${GITHUB_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${ASSET_PATH}" \
              "${GITHUB_UPLOADS_API}/repos/${REPO}/releases/${RELEASE_ID}/assets?name=${ASSET_NAME}")
            printf '%s' "$UPLOAD_JSON" | python3 -c 'import json,sys; expected=sys.argv[1]; data=json.load(sys.stdin); assert data.get("name") == expected, f"unexpected uploaded asset: {data!r}"' "$ASSET_NAME"
          done
          echo "✅ 已上传: https://github.com/${REPO}/releases/tag/${TAG}"

          # Keep the framework-latest tag as the stable release container.
          # platform.json will point at an immutable asset within this release.
          FRAMEWORK_TAG="framework-latest"
          FRAMEWORK_JSON=$(curl -fsS -H "Authorization: token ${GITHUB_TOKEN}" \
            "${GITHUB_API}/repos/${REPO}/releases/tags/${FRAMEWORK_TAG}" || echo "")
          if [ "$(echo "$FRAMEWORK_JSON" | grep -c '"id"')" -eq 0 ]; then
            echo "创建固定 tag release $FRAMEWORK_TAG"
            FRAMEWORK_JSON=$(curl -fsS -X POST -H "Authorization: token ${GITHUB_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"tag_name\":\"${FRAMEWORK_TAG}\",\"target_commitish\":\"develop\",\"name\":\"ESP32 Arduino Framework (latest)\",\"body\":\"complete Arduino framework package\",\"draft\":false,\"prerelease\":false}" \
              "${GITHUB_API}/repos/${REPO}/releases")
          fi
          FRAMEWORK_RELEASE_ID=$(echo "$FRAMEWORK_JSON" | grep -oP '"id":\s*\K[0-9]+' | head -1)
          test -n "$FRAMEWORK_RELEASE_ID" || { echo "framework-latest release response has no id" >&2; exit 1; }
          echo "framework-latest release_id=$FRAMEWORK_RELEASE_ID"
          # Query the existing immutable framework assets.
          FRAMEWORK_ASSETS_JSON=$(curl -fsS -H "Authorization: token ${GITHUB_TOKEN}" \
            "${GITHUB_API}/repos/${REPO}/releases/${FRAMEWORK_RELEASE_ID}/assets")
          # Retain older immutable assets because previous platform commits may
          # still reference them. Delete only an asset with this exact run name
          # when the same workflow run is re-executed.
          OLD_FW_ASSET_ID=$(echo "$FRAMEWORK_ASSETS_JSON" | python3 -c "import sys,json; name='${FRAMEWORK_ASSET_NAME}'; print(next((str(a.get('id')) for a in json.load(sys.stdin) if a.get('name') == name), ''))")
          if [ -n "$OLD_FW_ASSET_ID" ]; then
            echo "Deleting retry asset $OLD_FW_ASSET_ID"
            curl -fsS -X DELETE -H "Authorization: token ${GITHUB_TOKEN}" \
              "${GITHUB_API}/repos/${REPO}/releases/assets/${OLD_FW_ASSET_ID}"
          fi
          echo "Uploading immutable framework asset to framework-latest: $FRAMEWORK_ASSET_NAME"
          FRAMEWORK_UPLOAD_JSON=$(curl -fsS -X POST -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@tools/${FRAMEWORK_NAME}.tar.xz" \
            "${GITHUB_UPLOADS_API}/repos/${REPO}/releases/${FRAMEWORK_RELEASE_ID}/assets?name=${FRAMEWORK_ASSET_NAME}")
          printf '%s' "$FRAMEWORK_UPLOAD_JSON" | python3 -c 'import json,sys; expected=sys.argv[1]; data=json.load(sys.stdin); assert data.get("name") == expected, f"unexpected uploaded asset: {data!r}"' "$FRAMEWORK_ASSET_NAME"
          FRAMEWORK_FINAL_ASSETS_JSON=$(curl -fsS -H "Authorization: token ${GITHUB_TOKEN}" \
            "${GITHUB_API}/repos/${REPO}/releases/${FRAMEWORK_RELEASE_ID}/assets")
          printf '%s' "$FRAMEWORK_FINAL_ASSETS_JSON" | python3 -c 'import json,sys; expected=sys.argv[1]; names={a.get("name") for a in json.load(sys.stdin)}; assert expected in names, f"framework release asset missing: {expected}"' "$FRAMEWORK_ASSET_NAME"

          # Verify both assets are visible from the Release API after upload.
          FINAL_ASSETS_JSON=$(curl -fsS -H "Authorization: token ${GITHUB_TOKEN}" \
            "${GITHUB_API}/repos/${REPO}/releases/${RELEASE_ID}/assets")
          printf '%s' "$FINAL_ASSETS_JSON" | python3 -c 'import json,sys; required=set(sys.argv[1:]); names={a.get("name") for a in json.load(sys.stdin)}; missing=required-names; assert not missing, f"release assets missing: {sorted(missing)}"' "$ZIP_NAME" "$FRAMEWORK_ASSET_NAME"

          # Point platform.json to the immutable, verified framework asset. A
          # changed URL forces PlatformIO to avoid its fixed-URL package cache.
          FRAMEWORK_URL="https://github.com/${REPO}/releases/download/${FRAMEWORK_TAG}/${FRAMEWORK_ASSET_NAME}"
          python3 - "$FRAMEWORK_URL" <<'PY'
          import json
          import sys
          from pathlib import Path

          path = Path("platform.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["packages"]["framework-arduinoespressif32"]["version"] = sys.argv[1]
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          grep -F "$FRAMEWORK_URL" platform.json

          # Record completion only after every asset has been uploaded and verified.
          # A failed or partial publication must remain eligible for a full retry.
          echo "complete=yes" >> .last_build_versions
          git config --global user.name "ci-bot"
          git config --global user.email "ci-bot@localhost"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git"
          git add .last_build_versions platform.json
          git commit -m "chore: publish framework package" || echo "no version changes"
          git push origin HEAD:develop

          echo "✅ 已更新: https://github.com/${REPO}/releases/tag/${FRAMEWORK_TAG}"

      - name: 清理旧版本（只保留最新两个）
        run: |
          set -eu
          # 清理 libs-* release（只保留最新 2 个）、framework-latest 的旧 assets、
          # 以及所有 debug-run-* 中间 release（含本次构建的 chip-* 产物）。
          python3 tools/cleanup_releases.py \
            --repo "${{ github.repository }}" \
            --token "$GITHUB_TOKEN" \
            --keep 2
